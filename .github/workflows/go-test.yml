name: Go Tests and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # The race detector is slow and amplifies termsession's PTY-process I/O
      # timing, so we only run it on the POSIX hosts where those integration
      # tests run.
      - name: Test (race)
        if: matrix.os != 'windows-latest'
        run: go test -race ./...

  cross-compile:
    name: cross-compile (${{ matrix.target.goos }}/${{ matrix.target.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # 32-bit pointer-size sanity check. Catches any uintptr-vs-int
          # assumptions in runewidth/terminal that would only show up on
          # a 32-bit build.
          - { goos: linux, goarch: '386' }
          # arm64 is what most cloud Linux runs on now.
          - { goos: linux, goarch: arm64 }
          # Smoke test that the windows-tagged files still compile.
          - { goos: windows, goarch: amd64 }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Vet
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: go vet ./...

      - name: Build
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: go build ./...

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # govulncheck reports only advisories it can trace to a call from our
      # own code, so this stays quiet about vulnerable-but-unreached
      # dependency paths. It does read a live advisory database, which means
      # this job can turn red without a code change when something new lands
      # against a package we already call. That is the point of running it:
      # htmlparse, htmltomd, crawler, and thumbnail all parse input the
      # caller did not author.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
